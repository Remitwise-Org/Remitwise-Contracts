[package]
name = "reporting"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No std for WASM contracts
soroban-sdk = { version = "=21.7.7", default-features = false }
remitwise-common = { path = "../remitwise-common" }

[dev-dependencies]
# Test utilities need the testutils feature, but still no std
soroban-sdk = { version = "=21.7.7", default-features = false }
testutils = { path = "../testutils" }
