[package]
name = "remittance_split"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No std for WASM contracts
soroban-sdk = { version = "=21.7.7", default-features = false }
remitwise-common = { path = "../remitwise-common" }

[dev-dependencies]
proptest = "1.1.0"
soroban-sdk = { version = "=21.7.7", features = ["testutils"] }
testutils = { path = "../testutils" }
