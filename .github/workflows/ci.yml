name: Soroban Smart Contracts CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  build:
    name: Build and Test (${{ matrix.rust }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `stable` catches current-toolchain regressions; the pinned version
        # is the crate's documented MSRV (soroban-sdk's own `rust-version`)
        # so a contributor on the oldest supported compiler still builds.
        rust: [stable, "1.74.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Install Soroban CLI
        run: |
          if ! command -v soroban &> /dev/null; then
            echo "Attempting to install via Homebrew..."
            if brew list stellar-cli &>/dev/null || brew install stellar-cli 2>/dev/null; then
              echo "Installed via Homebrew"
            else
              echo "Homebrew install failed, installing via cargo..."
              cargo install --locked --version 21.0.0 soroban-cli
            fi
          fi
          # Try both commands in case Homebrew installs it as 'stellar'
          if command -v soroban &> /dev/null; then
            soroban --version
          elif command -v stellar &> /dev/null; then
            stellar --version
            # Create alias for consistency
            ln -s $(which stellar) /usr/local/bin/soroban || true
          else
            echo "Error: Neither soroban nor stellar CLI found"
            exit 1
          fi

      - name: Verify Rust installation
        run: |
          rustc --version
          cargo --version
          rustup target list --installed | grep wasm32-unknown-unknown || rustup target add wasm32-unknown-unknown

      - name: Build workspace (WASM)
        run: |
          cargo build --release --target wasm32-unknown-unknown --verbose
        continue-on-error: false

      - name: Build Soroban contracts
        run: |
          for contract in remittance_split savings_goals bill_payments insurance; do
            echo "Building contract: $contract"
            cd $contract
            # Skip soroban CLI build as it requires wasm32v1-none which isn't available
            # Use cargo directly with wasm32-unknown-unknown target
            echo "Building with cargo using wasm32-unknown-unknown target..."
            cargo build --release --target wasm32-unknown-unknown --verbose
            cd ..
          done
        continue-on-error: false

      - name: Verify WASM files exist
        run: |
          for contract in remittance_split savings_goals bill_payments insurance; do
            wasm_file="target/wasm32-unknown-unknown/release/${contract}.wasm"
            if [ ! -f "$wasm_file" ]; then
              echo "Error: WASM file not found: $wasm_file"
              exit 1
            fi
            echo "✓ Found: $wasm_file ($(du -h $wasm_file | cut -f1))"
          done

      - name: Run Cargo tests
        run: |
          cargo test --verbose --all-features
        continue-on-error: false

      - name: Run Clippy
        # Lint output can shift between toolchain versions; MSRV's job is
        # to prove the workspace builds and tests pass on the oldest
        # supported compiler, not to re-litigate style on it.
        if: matrix.rust == 'stable'
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: false

      - name: Check formatting
        if: matrix.rust == 'stable'
        run: |
          cargo fmt --all -- --check
        continue-on-error: false

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-contracts-${{ matrix.rust }}
          path: |
            target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7
          compression-level: 9

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.rust }}
          path: |
            target/**/*.log
          retention-days: 3

  security:
    name: Security Checks
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Install Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: stable
    - name: Cache Cargo registry
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: '~/.cargo/registry/index/

          ~/.cargo/registry/cache/

          ~/.cargo/git/db/

          '
        key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: 'cargo-registry-

          '
    - name: Cache Cargo target dir
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: '~/.cargo/bin/

          target/

          '
        key: cargo-target-${{ runner.os }}-stable-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: 'cargo-target-${{ runner.os }}-stable-

          cargo-target-${{ runner.os }}-

          '
    - name: Install cargo-audit
      run: "if ! command -v cargo-audit &> /dev/null; then\n  cargo install cargo-audit --locked\nfi\n"
    - name: Run cargo audit
      # Deliberately plain `cargo audit`, not `--deny warnings`: as of this
      # writing two transitive dependencies (bincode, paste) are flagged
      # "unmaintained" (RUSTSEC-2025-0141, RUSTSEC-2024-0436) with no fix
      # available — `--deny warnings` would fail every PR on an advisory
      # nobody here can act on. Plain `cargo audit` still fails (and blocks
      # this merge gate) on actual RUSTSEC *vulnerabilities*, which is the
      # thing worth gating merges on.
      run: cargo audit
  workspace-invariants:
    name: Workspace Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Check workspace invariants
      run: 'python3 scripts/check_workspace_invariants.py

        '
      continue-on-error: true
  cross-contract-invariants:
    name: Cross-Contract Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Verify cross-contract invariants
      run: 'python3 scripts/verify_cross_contract_invariants.py
        '
      continue-on-error: true
  storage-key-validation:
    name: Storage Key Naming Convention Validation
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Install Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: stable
    - name: Cache Cargo registry
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: '~/.cargo/registry/index/

          ~/.cargo/registry/cache/

          ~/.cargo/git/db/

          '
        key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: 'cargo-registry-

          '
    - name: Cache Cargo target dir
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: '~/.cargo/bin/

          target/

          '
        key: cargo-target-${{ runner.os }}-stable-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: 'cargo-target-${{ runner.os }}-stable-

          cargo-target-${{ runner.os }}-

          '
    - name: Run storage key naming convention tests
      run: 'cargo test --package testutils storage_key_naming_test -- --nocapture

        '
      continue-on-error: false
    - name: Run storage key source scan (drift detection)
      run: 'cargo test --package testutils --test storage_key_source_scan_test -- --nocapture

        '
      continue-on-error: false
    - name: Run reserved storage key enforcement check
      run: 'cargo test --package testutils --test reserved_storage_keys_test -- --nocapture

        '
      continue-on-error: false
  gas-benchmarks:
    name: Gas Benchmarks
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Install Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - name: Cache Cargo registry
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: '~/.cargo/registry/index/

          ~/.cargo/registry/cache/

          ~/.cargo/git/db/

          '
        key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: 'cargo-registry-

          '
    - name: Cache Cargo target dir
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: '~/.cargo/bin/

          target/

          '
        key: cargo-target-${{ runner.os }}-stable-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: 'cargo-target-${{ runner.os }}-stable-

          cargo-target-${{ runner.os }}-

          '
    - name: Install jq
      run: "if ! command -v jq &> /dev/null; then\n  brew install jq\nfi\n"
    - name: Run gas benchmarks
      run: './scripts/run_gas_benchmarks.sh

        '
      continue-on-error: false
    - name: Check for gas regressions
      run: "if [ -f benchmarks/baseline.json ]; then\n  echo \"Comparing against baseline...\"\n  ./scripts/compare_gas_results.sh benchmarks/baseline.json gas_results.json\nelse\n  echo \"\u26A0\uFE0F\
        \  No baseline found. Skipping regression check.\"\n  echo \"Run './scripts/update_baseline.sh' locally to create initial baseline.\"\nfi\n"
      continue-on-error: false
    - name: Upload gas benchmark results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: gas-benchmarks
        path: gas_results.json
        retention-days: 30
    - name: Comment PR with gas results
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: "const fs = require('fs');\n\nif (!fs.existsSync('gas_results.json')) {\n  console.log('No gas results found');\n  return;\n}\n\nconst results = JSON.parse(fs.readFileSync('gas_results.json',\
          \ 'utf8'));\n\nlet comment = '## \u26FD Gas Benchmark Results\\n\\n';\ncomment += '| Contract | Method | Scenario | CPU | Memory |\\n';\ncomment += '|----------|--------|----------|-----|--------|\\\
          n';\n\nresults.forEach(r => {\n  comment += `| ${r.contract} | ${r.method} | ${r.scenario} | ${r.cpu.toLocaleString()} | ${r.mem.toLocaleString()} |\\n`;\n});\n\ncomment += '\\n*Results are in\
          \ instruction/byte counts. Lower is better.*\\n';\n\n// Check if baseline exists and add comparison\nif (fs.existsSync('benchmarks/baseline.json')) {\n  const baseline = JSON.parse(fs.readFileSync('benchmarks/baseline.json',\
          \ 'utf8'));\n  comment += '\\n### Comparison vs Baseline\\n\\n';\n  \n  results.forEach(curr => {\n    const base = baseline.find(b => \n      b.contract === curr.contract && \n      b.method\
          \ === curr.method && \n      b.scenario === curr.scenario\n    );\n    \n    if (base && base.cpu > 0) {\n      const cpuChange = ((curr.cpu - base.cpu) / base.cpu * 100).toFixed(1);\n      const\
          \ memChange = ((curr.mem - base.mem) / base.mem * 100).toFixed(1);\n      const cpuIcon = cpuChange > 10 ? '\u26A0\uFE0F' : cpuChange < -5 ? '\u2728' : '\u2705';\n      const memIcon = memChange\
          \ > 10 ? '\u26A0\uFE0F' : memChange < -5 ? '\u2728' : '\u2705';\n      \n      comment += `- **${curr.contract}::${curr.method}**: CPU ${cpuIcon} ${cpuChange > 0 ? '+' : ''}${cpuChange}%, Memory\
          \ ${memIcon} ${memChange > 0 ? '+' : ''}${memChange}%\\n`;\n    }\n  });\n}\n\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n  owner: context.repo.owner,\n  repo:\
          \ context.repo.repo,\n  body: comment\n});\n"
  msrv:
    name: MSRV Check (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust:
        - stable
        - '1.88.0'
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Install Rust ${{ matrix.rust }}
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: ${{ matrix.rust }}
        targets: wasm32-unknown-unknown
    - name: Cache Cargo registry
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-registry-msrv-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-registry-msrv-${{ matrix.rust }}-
    - name: Cache Cargo target dir
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: |
          ~/.cargo/bin/
          target/
        key: cargo-target-${{ runner.os }}-msrv-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-target-${{ runner.os }}-msrv-${{ matrix.rust }}-
    - name: Check workspace compiles natively
      run: cargo check --workspace
    - name: Check contract crates compile for wasm32-unknown-unknown
      # Deliberately not --workspace: native-only tooling crates (cli,
      # integration_tests, scenarios) pull in dependencies (e.g. mio via
      # tokio) that don't support wasm32-unknown-unknown. The deployable
      # contracts are exactly Cargo.toml's [workspace] default-members,
      # which this picks up implicitly — same convention as check_ci.sh's
      # `cargo build --release --target wasm32-unknown-unknown`.
      run: cargo check --target wasm32-unknown-unknown
