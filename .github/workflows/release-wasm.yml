name: Publish WASM Artifacts on Tag

'on':
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and Publish WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build orchestrator and reporting (WASM release)
        run: |
          cargo build --release --target wasm32-unknown-unknown -p orchestrator -p reporting --verbose

      - name: Verify WASM files exist
        run: |
          for contract in orchestrator reporting; do
            wasm_file="target/wasm32-unknown-unknown/release/${contract}.wasm"
            if [ ! -f "$wasm_file" ]; then
              echo "Error: WASM file not found: $wasm_file"
              exit 1
            fi
            echo "✓ Found: $wasm_file ($(du -h "$wasm_file" | cut -f1))"
          done

      - name: Publish WASM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wasm32-unknown-unknown/release/orchestrator.wasm
            target/wasm32-unknown-unknown/release/reporting.wasm
          fail_on_unmatched_files: true
          generate_release_notes: true
